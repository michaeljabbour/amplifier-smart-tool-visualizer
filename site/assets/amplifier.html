<script>
"use strict";
const LIVE = false;
let D = JSON.parse(document.getElementById("data").textContent);
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const SUPPORT = new Set(["supports","confirms","evidence_for","supported_by","demonstrates","shows","validates"]);
const CONTRA = new Set(["contradicts","refutes","disputes","conflicts_with","undermines","challenges","evidence_against","contradicted_by"]);
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

const state = { selected: null, hover: null, search: "", hiddenTopics: new Set(), hiddenRel: new Set(),
  allLabels: false, asOf: null, gap: null, flashes: new Map(), path: null, pathEdges: null };
let nodes = [], byId = new Map(), links = [], prox = [];
const cam = { x: 0, y: 0, k: 1 };
const canvas = $("c"), ctx = canvas.getContext("2d");
let W = 0, H = 0, alpha = 1;

function build(keepPositions) {
  const old = byId;
  byId = new Map();
  nodes = D.nodes.map((n) => {
    const prev = old.get(n.id);
    const o = Object.assign({}, n, { r: 4 + 16 * Math.sqrt(n.degree_norm || 0) });
    if (keepPositions && prev) { o.x = prev.x; o.y = prev.y; o.vx = prev.vx; o.vy = prev.vy; o.fixed = prev.fixed; }
    byId.set(n.id, o);
    return o;
  });
  const topics = D.topics.map((t) => t.id);
  const centers = new Map();
  topics.forEach((t, i) => { const a = 2 * Math.PI * i / Math.max(1, topics.length); const R = 120 + 40 * Math.sqrt(nodes.length);
    centers.set(t, [Math.cos(a) * R, Math.sin(a) * R]); });
  for (const n of nodes) {
    if (n.x !== undefined) continue;
    const nb = D.edges.find((e) => (e.source === n.id && old.has(e.target)) || (e.target === n.id && old.has(e.source)));
    const anchor = nb ? byId.get(nb.source === n.id ? nb.target : nb.source) : null;
    const c = anchor && anchor.x !== undefined ? [anchor.x, anchor.y] : (centers.get(n.community) || [0, 0]);
    n.x = c[0] + (Math.random() - .5) * 80; n.y = c[1] + (Math.random() - .5) * 80; n.vx = 0; n.vy = 0;
    if (keepPositions) state.flashes.set(n.id, performance.now());
  }
  links = D.edges.filter((e) => byId.has(e.source) && byId.has(e.target)).map((e) => Object.assign({}, e, { s: byId.get(e.source), t: byId.get(e.target) }));
  prox = D.proximity.filter((p) => byId.has(p.source) && byId.has(p.target)).map((p) => Object.assign({}, p, { s: byId.get(p.source), t: byId.get(p.target) }));
  renderSidebar();
  setupTime();
  alpha = keepPositions ? Math.max(alpha, .3) : 1;
}

// ---- visibility ----
function edgeLive(e) {
  if (state.asOf) return e.valid_from <= state.asOf && (!e.valid_to || e.valid_to > state.asOf);
  return !e.valid_to || $("showClosed").checked;
}
function nodeVisible(n) {
  if (state.hiddenTopics.has(n.community)) return false;
  if (state.asOf && n.created_at && n.created_at > state.asOf) return false;
  if (!$("showIsolated").checked && !n.degree) return false;
  return true;
}
function linkVisible(e) { return edgeLive(e) && !state.hiddenRel.has(e.relation) && nodeVisible(e.s) && nodeVisible(e.t); }

// ---- layout ----
function tick() {
  const vis = nodes.filter(nodeVisible);
  const cell = 90, grid = new Map();
  for (const n of vis) { const k = Math.floor(n.x / cell) + "," + Math.floor(n.y / cell); (grid.get(k) || grid.set(k, []).get(k)).push(n); }
  for (const n of vis) {
    const gx = Math.floor(n.x / cell), gy = Math.floor(n.y / cell);
    for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) {
      const bucket = grid.get((gx + dx) + "," + (gy + dy)); if (!bucket) continue;
      for (const m of bucket) { if (m === n) continue;
        let x = n.x - m.x, y = n.y - m.y, d2 = x * x + y * y || .01; const min = n.r + m.r + 14;
        const f = (d2 < min * min ? 3 : 1) * 900 / d2; n.vx += x * f * alpha * .05; n.vy += y * f * alpha * .05; }
    }
    n.vx -= n.x * .0025 * alpha; n.vy -= n.y * .0025 * alpha;
  }
  const spring = (a, b, len, k) => { const x = b.x - a.x, y = b.y - a.y, d = Math.sqrt(x * x + y * y) || 1;
    const f = (d - len) / d * k * alpha; a.vx += x * f; a.vy += y * f; b.vx -= x * f; b.vy -= y * f; };
  for (const e of links) if (linkVisible(e)) spring(e.s, e.t, 70, .04);
  if ($("showProx").checked) for (const p of prox) if (nodeVisible(p.s) && nodeVisible(p.t)) spring(p.s, p.t, 110, .006 * Math.min(4, p.count));
  for (const n of vis) { if (n.fixed) { n.vx = n.vy = 0; continue; } n.vx *= .6; n.vy *= .6; n.x += n.vx; n.y += n.vy; }
  alpha *= .985;
}

// ---- drawing ----
function toScreen(x, y) { return [(x - cam.x) * cam.k + W / 2, (y - cam.y) * cam.k + H / 2]; }
function toWorld(x, y) { return [(x - W / 2) / cam.k + cam.x, (y - H / 2) / cam.k + cam.y]; }
function focusSet() {
  if (state.path) return state.path;
  if (state.gap) return state.gap;
  const id = state.selected || state.hover; if (!id) return null;
  const s = new Set([id]);
  for (const e of links) if (linkVisible(e)) { if (e.source === id) s.add(e.target); if (e.target === id) s.add(e.source); }
  return s;
}
function draw() {
  const dpr = window.devicePixelRatio || 1;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  const focus = focusSet(), q = state.search;
  const colEdge = css("--edge"), colProx = css("--prox"), colSup = css("--support"), colCon = css("--contra"), ink = css("--ink");
  if ($("showProx").checked) {
    ctx.strokeStyle = colProx; ctx.lineWidth = 1; ctx.globalAlpha = focus ? .15 : .5; ctx.beginPath();
    for (const p of prox) { if (!nodeVisible(p.s) || !nodeVisible(p.t)) continue;
      const [x1, y1] = toScreen(p.s.x, p.s.y), [x2, y2] = toScreen(p.t.x, p.t.y); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); }
    ctx.stroke(); ctx.globalAlpha = 1;
  }
  for (const e of links) {
    if (!linkVisible(e)) continue;
    const onPath = state.pathEdges && state.pathEdges.has(e.source + "|" + e.target);
    const on = state.pathEdges ? onPath : (!focus || (focus.has(e.source) && focus.has(e.target)));
    const [x1, y1] = toScreen(e.s.x, e.s.y), [x2, y2] = toScreen(e.t.x, e.t.y);
    ctx.strokeStyle = SUPPORT.has(e.relation) ? colSup : CONTRA.has(e.relation) ? colCon : colEdge;
    ctx.globalAlpha = on ? .9 : .08;
    ctx.lineWidth = Math.min(4, .8 + (e.method === "cooccurrence" ? Math.log(1 + e.weight) * .4 : 1) * (e.confidence || .8));
    if (onPath) { ctx.lineWidth = 4; ctx.strokeStyle = css("--accent"); }
    ctx.setLineDash(e.valid_to ? [5, 4] : []);
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    if (cam.k > .7 && on && e.method !== "cooccurrence") {
      const a = Math.atan2(y2 - y1, x2 - x1), r = e.t.r * cam.k + 2, ax = x2 - Math.cos(a) * r, ay = y2 - Math.sin(a) * r;
      ctx.setLineDash([]); ctx.beginPath(); ctx.moveTo(ax, ay);
      ctx.lineTo(ax - 7 * Math.cos(a - .4), ay - 7 * Math.sin(a - .4)); ctx.lineTo(ax - 7 * Math.cos(a + .4), ay - 7 * Math.sin(a + .4));
      ctx.closePath(); ctx.fillStyle = ctx.strokeStyle; ctx.fill();
      if (focus && cam.k > .9) { ctx.globalAlpha = .85; ctx.fillStyle = ink; ctx.font = "11px sans-serif";
        ctx.fillText(e.relation.replace(/_/g, " "), (x1 + x2) / 2 + 4, (y1 + y2) / 2 - 4); }
    }
  }
  ctx.setLineDash([]); ctx.globalAlpha = 1;
  const now = performance.now();
  const labelled = [];
  for (const n of nodes) {
    if (!nodeVisible(n)) continue;
    const [x, y] = toScreen(n.x, n.y), r = Math.max(2, n.r * cam.k);
    if (x < -50 || y < -50 || x > W + 50 || y > H + 50) continue;
    const match = q && (n.label.toLowerCase().includes(q) || n.id.includes(q));
    const dim = (focus && !focus.has(n.id)) || (q && !match);
    ctx.globalAlpha = dim ? .15 : 1;
    ctx.beginPath(); ctx.arc(x, y, r, 0, 2 * Math.PI); ctx.fillStyle = n.color; ctx.fill();
    if (n.type && n.type !== "concept" && n.type !== "term") { ctx.lineWidth = 2; ctx.strokeStyle = ink; ctx.globalAlpha = dim ? .1 : .55; ctx.stroke(); }
    const f = state.flashes.get(n.id);
    if (f && now - f < 4000) { ctx.globalAlpha = 1 - (now - f) / 4000; ctx.strokeStyle = css("--accent"); ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(x, y, r + 6 + (now - f) / 200, 0, 2 * Math.PI); ctx.stroke(); }
    if (n.id === state.selected) { ctx.globalAlpha = 1; ctx.strokeStyle = css("--accent"); ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(x, y, r + 3, 0, 2 * Math.PI); ctx.stroke(); }
    const show = state.allLabels || match || (focus && focus.has(n.id)) || r > 9 || (cam.k > 1.6 && r > 4);
    if (show && !dim) labelled.push([n, x, y, r]);
  }
  ctx.globalAlpha = 1; ctx.font = "12px -apple-system, sans-serif"; ctx.textBaseline = "middle";
  const boxes = [];
  labelled.sort((a, b) => b[3] - a[3]);
  for (const [n, x, y, r] of labelled) {
    const w = ctx.measureText(n.label).width, bx = x + r + 4, by = y - 8;
    if (!state.allLabels && boxes.some((b) => bx < b[0] + b[2] && bx + w > b[0] && by < b[1] + 16 && by + 16 > b[1]) && n.id !== state.selected) continue;
    boxes.push([bx, by, w]);
    ctx.fillStyle = css("--bg"); ctx.globalAlpha = .75; ctx.fillRect(bx - 2, by, w + 4, 16);
    ctx.globalAlpha = 1; ctx.fillStyle = ink; ctx.fillText(n.label, bx, y);
  }
}
function loop() { if (alpha > .02) tick(); draw(); requestAnimationFrame(loop); }

// ---- sidebar ----
function renderSidebar() {
  $("title").textContent = "Knowledge: " + D.graph + (D.focus ? " · around “" + D.focus + "”" : "");
  $("counts").textContent = D.counts.nodes + " concepts · " + D.edges.filter((e) => !e.valid_to).length + " relations · " + D.counts.topics + " topics" + (D.truncated ? " · showing the most connected" : "");
  $("topics").innerHTML = D.topics.slice(0, 40).map((t) => '<div class="row' + (state.hiddenTopics.has(t.id) ? " off" : "") + '" data-topic="' + t.id + '" title="' + esc(t.summary || "Click to hide or show") + '"><span class="dot" style="background:' + t.color + '"></span><span class="name">' + esc(t.label) + '</span><span class="num">' + t.size + "</span></div>").join("") || '<p class="empty">No topics yet.</p>';
  const rels = {}; for (const e of D.edges) if (!e.valid_to) rels[e.relation] = (rels[e.relation] || 0) + 1;
  const relList = Object.entries(rels).sort((a, b) => b[1] - a[1]);
  $("relations").innerHTML = relList.slice(0, state.allRels ? 200 : 12).map(([r, c]) => '<label class="check"><input type="checkbox" data-rel="' + esc(r) + '"' + (state.hiddenRel.has(r) ? "" : " checked") + "> " + esc(r.replace(/_/g, " ")) + ' <span class="num">' + c + "</span></label>").join("") || '<p class="empty">None.</p>';
  if (relList.length > 12) $("relations").innerHTML += '<button id="moreRels" type="button">' + (state.allRels ? "Show fewer" : "Show all " + relList.length) + "</button>";
  $("gaps").innerHTML = D.gaps.map((g, i) => '<div class="gap" data-gap="' + i + '"><div>' + esc(g.topics[0]) + " ↔ " + esc(g.topics[1]) + '</div><div class="score">gap ' + g.score + " · try " + esc(g.bridge_candidates[0][0]) + " + " + esc(g.bridge_candidates[1][0]) + "</div></div>").join("") || '<p class="empty">No large gaps.</p>';
  const dv = D.diversity || {};
  $("diversity").innerHTML = dv.state ? "<b>" + esc(dv.state) + "</b> (modularity " + dv.modularity + ")<br>" + esc(dv.advice) : "";
}
$("topics").addEventListener("click", (ev) => { const row = ev.target.closest("[data-topic]"); if (!row) return;
  const t = +row.dataset.topic; state.hiddenTopics.has(t) ? state.hiddenTopics.delete(t) : state.hiddenTopics.add(t); renderSidebar(); alpha = Math.max(alpha, .2); });
$("relations").addEventListener("click", (ev) => { if (ev.target.id === "moreRels") { state.allRels = !state.allRels; renderSidebar(); } });
$("relations").addEventListener("change", (ev) => { const r = ev.target.dataset.rel; if (!r) return; ev.target.checked ? state.hiddenRel.delete(r) : state.hiddenRel.add(r); });
$("gaps").addEventListener("click", (ev) => { const el = ev.target.closest("[data-gap]"); if (!el) return;
  const g = D.gaps[+el.dataset.gap], key = g.between.join();
  if (state.gapKey === key) { state.gap = null; state.gapKey = null; } else {
    state.gapKey = key; state.gap = new Set(nodes.filter((n) => g.between.includes(n.community)).map((n) => n.id)); }
  document.querySelectorAll(".gap").forEach((x) => x.classList.toggle("on", x === el && !!state.gap));
  if (state.gap) $("detail").innerHTML = '<h3>A gap between two topics</h3><p>' + esc(g.prompt) + '</p><p class="num">Observed link weight ' + g.observed_weight + ", expected about " + g.expected_weight + ' if the topics were linked at random.</p><p>Bridge candidates:</p><p>' + g.bridge_candidates.map((c) => c.map((x) => '<span class="link" data-node="' + esc(x) + '">' + esc(x) + "</span>").join(", ")).join("<br>") + '</p><p class="num">Ask a model for questions that would bridge it: <code>knowledge questions</code></p>';
});
["showProx", "showClosed", "showIsolated"].forEach((id) => $(id).addEventListener("change", () => { alpha = Math.max(alpha, .2); }));

const EMPTY_DETAIL = $("detail").innerHTML;
function clearDetail() { state.selected = null; state.gap = null; state.gapKey = null; state.path = null; state.pathEdges = null;
  $("detail").innerHTML = EMPTY_DETAIL; document.querySelectorAll(".gap").forEach((x) => x.classList.remove("on")); }

// ---- paths ----
function tracePath(a, b) {
  // typed relations first; shared passages only when they are the only way through
  return bfsPath(a, b, false) || ($("showProx").checked ? bfsPath(a, b, true) : null);
}
function bfsPath(a, b, withProx) {
  const adj = new Map();
  const add = (x, y, label) => { (adj.get(x) || adj.set(x, []).get(x)).push([y, label]); };
  for (const e of links) if (linkVisible(e)) { add(e.source, e.target, e); add(e.target, e.source, e); }
  if (withProx) for (const p of prox) if (nodeVisible(p.s) && nodeVisible(p.t)) { add(p.source, p.target, null); add(p.target, p.source, null); }
  const prev = new Map([[a, null]]), q = [a];
  while (q.length) { const v = q.shift(); if (v === b) break;
    for (const [w, e] of (adj.get(v) || [])) if (!prev.has(w)) { prev.set(w, [v, e]); q.push(w); } }
  if (!prev.has(b)) return null;
  const steps = []; let cur = b;
  while (prev.get(cur)) { const [v, e] = prev.get(cur); steps.unshift([v, cur, e]); cur = v; }
  return steps;
}
function showPath(a, b) {
  const steps = tracePath(a, b);
  state.selected = null; state.gap = null;
  if (!steps) { state.path = null; state.pathEdges = null;
    $("detail").innerHTML = "<h3>No path</h3><p>" + esc(a) + " and " + esc(b) + ' are not connected in what is shown. That is a gap worth asking about: <code>knowledge gaps --between "' + esc(a) + '" "' + esc(b) + '"</code></p>'; return; }
  state.path = new Set([a, ...steps.map((s) => s[1])]);
  state.pathEdges = new Set(); for (const [x, y] of steps) { state.pathEdges.add(x + "|" + y); state.pathEdges.add(y + "|" + x); }
  $("detail").innerHTML = "<h3>How they connect</h3><p class=\"num\">" + steps.length + " step" + (steps.length > 1 ? "s" : "") + " from " + esc(a) + " to " + esc(b) + "</p>" +
    steps.map(([x, y, e]) => { const a = e ? e.source : x, b = e ? e.target : y; return '<div class="rel"><span class="link" data-node="' + esc(a) + '">' + esc(a) + "</span> " +
      (e ? '<span class="r ' + (SUPPORT.has(e.relation) ? "support" : CONTRA.has(e.relation) ? "contra" : "") + '">' + esc(e.relation.replace(/_/g, " ")) + "</span>" : '<span class="r">appears with</span>') +
      ' <span class="link" data-node="' + esc(b) + '">' + esc(b) + "</span>" + (e && e.description ? '<div class="d">' + esc(e.description) + "</div>" : "") + "</div>"; }).join("") +
    '<p class="num">Click empty space to clear. The full version, with passages: <code>knowledge path "' + esc(a) + '" "' + esc(b) + '"</code></p>';
}

// ---- detail ----
function select(id, center) {
  state.selected = id; state.gap = null; state.gapKey = null; state.path = null; state.pathEdges = null;
  const n = byId.get(id); if (!n) return;
  if (center) { cam.x = n.x; cam.y = n.y; cam.k = Math.max(cam.k, 1.4); }
  const topic = D.topics.find((t) => t.id === n.community);
  const rel = (e, out) => { const other = out ? e.target : e.source; const cls = SUPPORT.has(e.relation) ? "support" : CONTRA.has(e.relation) ? "contra" : "";
    return '<div class="rel' + (e.valid_to ? " closed" : "") + '">' + (out ? "" : '<span class="link" data-node="' + esc(other) + '">' + esc(other) + "</span> ") + '<span class="r ' + cls + '">' + esc(e.relation.replace(/_/g, " ")) + "</span>" + (out ? ' <span class="link" data-node="' + esc(other) + '">' + esc(other) + "</span>" : "") +
      (e.description ? '<div class="d">' + esc(e.description) + "</div>" : "") +
      '<div class="num">' + [e.confidence != null ? "confidence " + (+e.confidence).toFixed(2) : "", e.agent ? "by " + esc(e.agent) : "", e.valid_from ? "from " + e.valid_from.slice(0, 10) : "", e.valid_to ? "closed " + e.valid_to.slice(0, 10) : ""].filter(Boolean).join(" · ") + "</div></div>"; };
  const shown = (e) => (state.asOf ? edgeLive(e) : (!e.valid_to || $("showClosed").checked));
  const typed = (e) => e.method !== "cooccurrence";
  const outs = D.edges.filter((e) => e.source === id && typed(e) && shown(e));
  const ins = D.edges.filter((e) => e.target === id && typed(e) && shown(e));
  const near = new Map();
  for (const e of D.edges) if (!typed(e) && shown(e) && (e.source === id || e.target === id)) { const o = e.source === id ? e.target : e.source; near.set(o, (near.get(o) || 0) + e.weight); }
  for (const p of D.proximity) if (p.source === id || p.target === id) { const o = p.source === id ? p.target : p.source; near.set(o, (near.get(o) || 0) + p.count); }
  const nearList = [...near.entries()].sort((a, b) => b[1] - a[1]).slice(0, 24);
  const closedCount = D.edges.filter((e) => (e.source === id || e.target === id) && e.valid_to).length;
  $("detail").innerHTML = "<h3>" + esc(n.label) + "</h3>" +
    '<div class="meta"><span class="chip">' + esc(n.type) + "</span>" + (topic ? '<span class="chip" style="border-left:3px solid ' + topic.color + '">' + esc(topic.label) + "</span>" : "") +
    "<br>" + n.degree + " links · influence " + (+n.betweenness || 0).toFixed(3) + (closedCount ? " · " + closedCount + " closed in history" : "") + "</div>" +
    (n.summary ? "<p>" + esc(n.summary) + "</p>" : "") +
    (outs.length ? "<h2>Says</h2>" + outs.slice(0, 60).map((e) => rel(e, true)).join("") : "") +
    (ins.length ? "<h2>Said about it</h2>" + ins.slice(0, 60).map((e) => rel(e, false)).join("") : "") +
    (nearList.length ? '<h2>Appears near</h2><p>' + nearList.map(([o]) => '<span class="link" data-node="' + esc(o) + '">' + esc(o) + "</span>").join(", ") + "</p>" : "") +
    (n.passages && n.passages.length ? "<h2>Where it comes from</h2>" + n.passages.map((p) => "<blockquote>" + esc(p.excerpt) + "<br>— " + esc(p.source) + "</blockquote>").join("") : "") +
    '<p class="num">Shift-click another concept to trace how they connect.</p><h2>Ask the tool</h2><p class="num"><code>knowledge evidence "' + esc(n.id) + '"</code><br><code>knowledge timeline "' + esc(n.id) + '"</code></p>';
}
$("right").addEventListener("click", (ev) => { const el = ev.target.closest("[data-node]"); if (el) select(el.dataset.node, true); });

// ---- time ----
function setupTime() {
  const marks = (D.time && D.time.marks) || [];
  const s = $("slider"); s.max = marks.length; if (+s.value > marks.length || !state.asOf) s.value = marks.length;
  $("time").style.display = marks.length > 1 ? "flex" : "none";
}
$("slider").addEventListener("input", () => { const marks = D.time.marks, i = +$("slider").value;
  state.asOf = i >= marks.length ? null : marks[i]; $("when").textContent = state.asOf ? state.asOf.replace("T", " ").replace("Z", " UTC") : "now"; alpha = Math.max(alpha, .15);
  if (state.selected) select(state.selected); });

let playing = null;
$("play").onclick = () => {
  if (playing) { clearInterval(playing); playing = null; $("play").textContent = "Play"; return; }
  const s = $("slider"); if (+s.value >= +s.max) s.value = 0;
  $("play").textContent = "Pause";
  playing = setInterval(() => { if (+s.value >= +s.max) { clearInterval(playing); playing = null; $("play").textContent = "Play"; return; }
    s.value = +s.value + 1; s.dispatchEvent(new Event("input")); }, Math.max(60, 9000 / Math.max(1, +s.max)));
};

// ---- interaction ----
function resize() { const r = canvas.parentElement.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  W = r.width; H = r.height; canvas.width = W * dpr; canvas.height = H * dpr; }
function fit() { const vis = nodes.filter(nodeVisible); if (!vis.length) return;
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const n of vis) { x0 = Math.min(x0, n.x); y0 = Math.min(y0, n.y); x1 = Math.max(x1, n.x); y1 = Math.max(y1, n.y); }
  cam.x = (x0 + x1) / 2; cam.y = (y0 + y1) / 2; cam.k = Math.min(2.6, .9 * Math.min(W / (x1 - x0 + 120), (H - 90) / (y1 - y0 + 120))); }
function hit(mx, my) { const [x, y] = toWorld(mx, my); let best = null, bd = Infinity;
  for (const n of nodes) { if (!nodeVisible(n)) continue; const d = Math.hypot(n.x - x, n.y - y); if (d < n.r + 6 / cam.k && d < bd) { best = n; bd = d; } } return best; }
let drag = null, pan = null, moved = false;
canvas.addEventListener("mousedown", (ev) => { const n = hit(ev.offsetX, ev.offsetY); moved = false;
  if (n) { drag = n; n.fixed = true; } else pan = [ev.offsetX, ev.offsetY, cam.x, cam.y]; canvas.classList.add("dragging"); });
window.addEventListener("mousemove", (ev) => { const r = canvas.getBoundingClientRect(), mx = ev.clientX - r.left, my = ev.clientY - r.top;
  if (drag) { const [x, y] = toWorld(mx, my); drag.x = x; drag.y = y; moved = true; alpha = Math.max(alpha, .1); }
  else if (pan) { cam.x = pan[2] - (mx - pan[0]) / cam.k; cam.y = pan[3] - (my - pan[1]) / cam.k; moved = true; }
  else if (ev.target === canvas) { const n = hit(mx, my); state.hover = n ? n.id : null; canvas.title = n ? n.label : ""; } });
window.addEventListener("mouseup", (ev) => { canvas.classList.remove("dragging");
  if (!moved && ev.target === canvas) { const n = hit(ev.offsetX, ev.offsetY);
    if (n && ev.shiftKey && state.selected && state.selected !== n.id) showPath(state.selected, n.id);
    else if (n) select(n.id); else { clearDetail(); } }
  if (drag && !moved) drag.fixed = false; drag = null; pan = null; });
canvas.addEventListener("dblclick", (ev) => { const n = hit(ev.offsetX, ev.offsetY); if (n) n.fixed = false; });
canvas.addEventListener("wheel", (ev) => { ev.preventDefault(); const [wx, wy] = toWorld(ev.offsetX, ev.offsetY);
  cam.k = Math.min(8, Math.max(.05, cam.k * Math.exp(-ev.deltaY * .0015)));
  const [nx, ny] = toWorld(ev.offsetX, ev.offsetY); cam.x += wx - nx; cam.y += wy - ny; }, { passive: false });
$("search").addEventListener("input", (ev) => { state.search = ev.target.value.trim().toLowerCase(); });
$("search").addEventListener("keydown", (ev) => { if (ev.key !== "Enter" || !state.search) return;
  const m = nodes.filter((n) => nodeVisible(n) && n.label.toLowerCase().includes(state.search)).sort((a, b) => b.r - a.r)[0]; if (m) select(m.id, true); });
$("fit").onclick = fit;
$("labels").onclick = () => { state.allLabels = !state.allLabels; $("labels").setAttribute("aria-pressed", state.allLabels); };
$("keysBtn").onclick = () => { const k = $("keys"); k.style.display = k.style.display === "block" ? "none" : "block"; };
window.addEventListener("keydown", (ev) => { if (ev.target.tagName === "INPUT" && ev.key !== "Escape") return;
  if (ev.key === "/") { ev.preventDefault(); $("search").focus(); }
  else if (ev.key === "f" || ev.key === "F") fit();
  else if (ev.key === "l" || ev.key === "L") $("labels").click();
  else if (ev.key === "h" || ev.key === "H") { $("showClosed").checked = !$("showClosed").checked; }
  else if (ev.key === "Escape") { clearDetail(); state.search = ""; $("search").value = ""; $("search").blur(); }
  else if (ev.key === "ArrowLeft" || ev.key === "ArrowRight") { const s = $("slider"); s.value = +s.value + (ev.key === "ArrowLeft" ? -1 : 1); s.dispatchEvent(new Event("input")); } });
window.addEventListener("resize", resize);

// ---- live: follow the change log while agents write ----
function describe(ev) {
  const who = ev.agent ? ev.agent + ": " : "";
  if (ev.kind === "edge_added") return who + ev.source + " —" + ev.relation.replace(/_/g, " ") + "→ " + ev.target;
  if (ev.kind === "edge_superseded") return who + "closed " + ev.source + " " + ev.relation + " " + ev.target;
  if (ev.kind === "node_added") return "new concept: " + ev.label;
  if (ev.kind === "conflict_recorded") return "conflict: " + ev.verdict;
  if (ev.kind === "source_added") return who + "read " + (ev.title || ev.uri);
  return ev.kind.replace(/_/g, " ");
}
function ticker(lines) { const t = $("ticker"); for (const l of lines) { const d = document.createElement("div"); d.textContent = l; t.prepend(d); setTimeout(() => d.remove(), 9000); }
  while (t.children.length > 6) t.lastChild.remove(); }
async function poll() {
  try {
    const r = await fetch("api/events?since=" + D.last_event); const body = await r.json();
    if (body.events && body.events.length) {
      ticker(body.events.filter((e) => e.kind !== "node_updated").slice(-6).map(describe));
      const g = await (await fetch("api/graph" + location.search)).json(); D = g; build(true);
      if (state.selected && byId.has(state.selected)) select(state.selected);
    }
    $("hint").textContent = "Live · following changes";
  } catch (e) { $("hint").textContent = "Live view lost the connection; retrying"; }
  setTimeout(poll, 1500);
}

resize(); build(false);
for (let i = 0; i < 220; i++) tick();
fit(); loop();
if (LIVE) poll();
window.knowledgeView = { select: (id) => select(id, true), path: showPath, fit, state,
  screen: (id) => { const n = byId.get(id); if (!n) return null; const [x, y] = toScreen(n.x, n.y), r = canvas.getBoundingClientRect(); return [x + r.left, y + r.top]; } };
if (location.hash.startsWith("#concept=")) { const id = decodeURIComponent(location.hash.slice(9)); if (byId.has(id)) select(id, true); }
</script>
</body>
