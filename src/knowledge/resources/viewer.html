<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="__CSP__">
<title>__TITLE__</title>
<style>
:root {
  --bg: #f7f7f5; --panel: #ffffff; --ink: #1f2328; --muted: #646b73; --line: #e3e3df; --accent: #2f6fde;
  --support: #2e9d5b; --contra: #d1453b; --edge: #9aa3ad; --prox: #c9ced4; --chip: #f0f0ec;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #15171a; --panel: #1d2024; --ink: #e8eaed; --muted: #9aa0a6; --line: #2c3036; --accent: #6ea0ff;
          --edge: #5f6872; --prox: #353b42; --chip: #262a2f; }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
  font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
#app { display: grid; grid-template-columns: 270px 1fr 340px; grid-template-rows: 48px 1fr; height: 100vh; }
header { grid-column: 1 / 4; display: flex; align-items: center; gap: 12px; padding: 0 14px;
  border-bottom: 1px solid var(--line); background: var(--panel); }
header h1 { font-size: 15px; margin: 0; font-weight: 600; white-space: nowrap; }
header .counts { color: var(--muted); font-size: 12px; white-space: nowrap; }
header .spacer { flex: 1; }
input[type=search] { width: 260px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px;
  background: var(--bg); color: var(--ink); font: inherit; }
button { font: inherit; font-size: 13px; padding: 5px 10px; border: 1px solid var(--line); border-radius: 6px;
  background: var(--panel); color: var(--ink); cursor: pointer; }
button:hover { border-color: var(--accent); }
button[aria-pressed=true] { background: var(--accent); color: #fff; border-color: var(--accent); }
aside { overflow-y: auto; background: var(--panel); padding: 12px 14px; }
#left { border-right: 1px solid var(--line); }
#right { border-left: 1px solid var(--line); }
h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 16px 0 6px; }
h2:first-child { margin-top: 0; }
.row { display: flex; align-items: center; gap: 8px; padding: 3px 0; cursor: pointer; }
.row:hover .name { color: var(--accent); }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.num { color: var(--muted); font-size: 12px; }
.off { opacity: .35; }
label.check { display: flex; gap: 8px; align-items: center; padding: 2px 0; cursor: pointer; }
.gap { border: 1px solid var(--line); border-radius: 8px; padding: 8px; margin: 6px 0; cursor: pointer; font-size: 13px; }
.gap:hover, .gap.on { border-color: var(--accent); }
.gap .score { color: var(--muted); font-size: 12px; }
main { display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
canvas { display: block; position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; }
canvas.dragging { cursor: grabbing; }
#time { position: absolute; left: 16px; right: 16px; bottom: 12px; display: flex; gap: 10px; align-items: center;
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 12px; }
#time input { flex: 1; }
#time .when { min-width: 150px; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
#ticker { position: absolute; left: 16px; top: 12px; max-width: 46%; font-size: 12px; pointer-events: none; }
#ticker div { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--accent);
  border-radius: 6px; padding: 4px 8px; margin-bottom: 4px; opacity: .95; }
#why { display: none; flex: none; flex-wrap: wrap; align-items: flex-start; gap: 4px 8px; padding: 5px 12px; background: var(--panel);
  border-bottom: 1px solid var(--line); border-left: 3px solid var(--accent); font-size: 13px; line-height: 1.4; }
#why .wl { flex: 1; min-width: 0; }
#why button { font-size: 12px; padding: 2px 8px; } #why #whyClose { border: 0; background: none; color: var(--muted); font-size: 18px; line-height: 1; padding: 0 4px; }
#whyBody { flex-basis: 100%; padding: 4px 0 6px; }
#why .q { color: var(--muted); margin-bottom: 4px; }
#why .alt { color: var(--muted); margin-top: 8px; font-size: 12px; }
#why ul { margin: 4px 0 0; padding-left: 16px; }
#why code { font-size: 11px; word-break: break-word; }
#stage { position: relative; flex: 1; min-height: 0; overflow: hidden; }
#hint { position: absolute; right: 16px; top: 12px; color: var(--muted); font-size: 12px; background: var(--panel);
  border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
.chip { display: inline-block; background: var(--chip); border-radius: 4px; padding: 1px 6px; font-size: 12px; margin-right: 4px; }
.detail h3 { margin: 0 0 4px; font-size: 18px; }
.detail .meta { color: var(--muted); font-size: 12px; margin-bottom: 10px; }
.rel { padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.rel .r { font-weight: 600; }
.rel .r.support { color: var(--support); } .rel .r.contra { color: var(--contra); }
.rel .d { color: var(--muted); }
.rel.closed { opacity: .55; } .rel.closed .r { text-decoration: line-through; }
.link { color: var(--accent); cursor: pointer; }
blockquote { margin: 6px 0; padding: 4px 10px; border-left: 3px solid var(--line); color: var(--muted); font-size: 13px; }
.empty { color: var(--muted); }
#keys { display: none; position: absolute; right: 16px; top: 44px; background: var(--panel); border: 1px solid var(--line);
  border-radius: 8px; padding: 10px 14px; font-size: 12px; line-height: 1.8; }
@media (max-width: 900px) { #app { grid-template-columns: 1fr; grid-template-rows: 48px 50vh auto auto; }
  #left, #right { border: 0; border-top: 1px solid var(--line); } header { grid-column: 1; } }

/* ---- views ---- */
#tabs { display: flex; gap: 2px; margin-left: 8px; }
#tabs button { border: 0; background: none; color: var(--muted); padding: 5px 11px; border-radius: 6px; }
#tabs button:hover { color: var(--ink); background: var(--chip); }
#tabs button[aria-selected=true] { background: var(--accent); color: #fff; }
main.vmode #hint, main.vmode #ticker { display: none; }
#vpanel { position: absolute; inset: 0; overflow: auto; padding: 14px 16px 72px; background: var(--bg); }
#vpanel[hidden] { display: none; }
.vhead { display: flex; align-items: center; gap: 12px; }
.vt { font-size: 18px; text-transform: none; letter-spacing: 0; color: var(--ink); margin: 0; }
.vmap { margin-left: auto; }
.vcap { color: var(--muted); margin: 4px 0 8px; max-width: 78ch; }
.vsum, .vsub { margin: 4px 0 10px; }
.vsvg { display: block; max-width: none; font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
.vlab, .vtiny { fill: var(--ink); } .vtiny { font-size: 11px; fill: var(--muted); } .vtiny.on { fill: #fff; }
.vlink { cursor: pointer; } .vlink:hover { fill: var(--accent); }
.vtick, .vtot { fill: var(--muted); font-size: 12px; } .vmark { fill: var(--muted); font-size: 11px; } .vmark.acc { fill: var(--accent); }
.vgrid, .vsep { stroke: var(--line); stroke-width: 1; } .vnow { stroke: var(--muted); stroke-dasharray: 2 3; }
.vasof { stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 5 3; }
.bar { cursor: pointer; fill: var(--accent); } .bar.support { fill: var(--support); } .bar.contra { fill: var(--contra); }
.bar:hover, .bar:focus { stroke: var(--ink); stroke-width: 2; stroke-opacity: 1; outline: none; }
.varrow { fill: none; stroke: var(--muted); stroke-width: 1.3; } .ahead { fill: var(--muted); }
.re { fill: var(--chip); opacity: .6; } .rc { fill: var(--accent); cursor: pointer; } .rc:hover { stroke: var(--ink); stroke-width: 2; }
.rcn { fill: var(--ink); font-size: 11px; pointer-events: none; } .rcn.hi { fill: var(--bg); }
.rasof { fill: none; stroke: var(--accent); stroke-width: 2; pointer-events: none; }
.arg { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; align-items: start; margin-top: 12px; } .arg.one { grid-template-columns: 1fr; }
.acards { display: grid; grid-template-columns: 1fr; gap: 0 10px; } .arg.one .acards { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
.acol h3 { margin: 0 0 8px; font-size: 14px; } h3.for { color: var(--support); } h3.against { color: var(--contra); }
.claim { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; }
.claim h3 { font-size: 18px; margin: 2px 0 6px; }
.acard { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--edge); border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; font-size: 13px; }
.acard.support { border-left-color: var(--support); } .acard.contra { border-left-color: var(--contra); }
.acard.closed { opacity: .55; } .acard .ah { font-weight: 600; } .acard .d { color: var(--muted); }
blockquote.qt { font-style: italic; margin: 4px 0; }
.conf { height: 4px; background: var(--line); border-radius: 2px; margin-top: 6px; } .conf i { display: block; height: 100%; background: var(--accent); border-radius: 2px; }
.also { margin-top: 16px; } .also summary { cursor: pointer; color: var(--muted); }
.alsogrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 0 10px; margin-top: 8px; }
.contested { max-width: 900px; } .chd, .crow { display: grid; grid-template-columns: minmax(220px, 1.1fr) 1.4fr; gap: 12px; align-items: center; }
.axl { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; }
.crow { padding: 3px 4px; border-radius: 6px; cursor: pointer; } .crow:hover, .crow:focus { background: var(--chip); outline: none; }
.cname { line-height: 1.3; overflow-wrap: anywhere; }
.cbar { display: flex; height: 18px; } .half { flex: 1; display: flex; } .half.l { justify-content: flex-end; border-right: 1px solid var(--muted); }
.bi { display: flex; align-items: center; min-width: 20px; padding: 0 5px; color: #fff; font-size: 11px; height: 18px; } .bi.against { background: var(--contra); justify-content: flex-start; border-radius: 3px 0 0 3px; } .bi.for { background: var(--support); border-radius: 0 3px 3px 0; }
.sform { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 6px 0 14px; }
.sform input { padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); font: inherit; width: 220px; }
.pcols { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 18px; align-items: start; }
.pcol h3 { font-size: 14px; margin: 0 0 8px; }
.pill { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 4px 12px; font-weight: 600; cursor: pointer; text-align: center; }
.pill:hover, .pill:focus { border-color: var(--accent); outline: none; }
.conn { border-left: 2px solid var(--line); margin: 0 0 0 24px; padding: 4px 0 6px 12px; font-size: 13px; }
.conn .d { color: var(--muted); } .nopath { max-width: 560px; }
.mwrap { overflow: auto; } table.matrix { border-collapse: separate; border-spacing: 3px; table-layout: fixed; width: 100%; max-width: 1100px; }
.matrix th { font-weight: 500; font-size: 12px; color: var(--ink); } .matrix th.corner { width: 250px; }
.matrix th.vcol { height: 270px; vertical-align: bottom; padding: 0; }
.matrix th.vcol span { display: inline-block; max-height: 260px; white-space: nowrap; writing-mode: vertical-rl; transform: rotate(180deg); line-height: 1.25; text-align: left; margin-bottom: 4px; }
.matrix th.rowh { text-align: right; padding-right: 8px; line-height: 1.25; } .matrix .dot { display: inline-block; margin-right: 6px; }
td.mc { position: relative; height: 48px; text-align: center; font-variant-numeric: tabular-nums; border-radius: 4px; background: var(--chip); cursor: pointer; }
td.mc .mn { font-size: 11px; opacity: .78; }
td.mc:hover, td.mc:focus { outline: none; box-shadow: inset 0 0 0 2px var(--accent); } td.mc.diag { color: var(--muted); cursor: default; }
td.mc.gap { outline: 3px solid var(--ink); outline-offset: -3px; padding-top: 14px; }
.gm { position: absolute; top: 4px; left: 5px; font-size: 10px; font-weight: 700; line-height: 14px; padding: 0 5px; border-radius: 3px; background: var(--ink); color: var(--bg); }
.key { display: inline-block; width: 12px; height: 12px; vertical-align: -2px; border-radius: 3px; margin-left: 8px; }
.warmk { background: rgb(194, 65, 12); } .acck { background: var(--accent); } .gapk { border: 3px solid var(--ink); }
.detail button { margin-top: 4px; }

/* ---- second pass ---- */
.acol, .acard, .pcol, .conn, .alsogrid > * { min-width: 0; } .acards { grid-template-columns: minmax(0, 1fr); } .arg.one .acards { grid-template-columns: repeat(auto-fill, minmax(min(280px, 100%), 1fr)); }
.vsum.legend { color: var(--muted); font-size: 12px; margin: 2px 0 6px; }
.lg { display: inline-block; width: 22px; height: 10px; vertical-align: -1px; border-radius: 2px; } .lg.solid { background: var(--accent); }
.lg.dashed { border: 1px dashed var(--ink); background: transparent; } .lg.arr { width: auto; color: var(--ink); }
.vgroup { fill: var(--muted); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
.vcap { stroke: var(--ink); stroke-width: 2; } .vbt { fill: var(--ink); font-size: 11px; pointer-events: none; } .vbt.on { fill: var(--bg); }
.varrow { fill: none; stroke: var(--ink); stroke-opacity: .7; stroke-width: 1.5; } .ahead { fill: var(--ink); fill-opacity: .7; }
.vlab.c, .vtot, .rcn { dominant-baseline: central; }
.vbrk { stroke: var(--muted); stroke-dasharray: 2 3; } .vbrkt { fill: var(--muted); font-size: 14px; dominant-baseline: central; }
.sw { display: inline-block; width: 18px; height: 12px; background: var(--accent); vertical-align: -2px; border-radius: 2px; } .sw.empty { background: var(--chip); opacity: .6; }
.acard { padding: 7px 10px; } .ah { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 8px; } .ah .link { font-weight: 600; }
.rch { margin: 0; color: var(--muted); } .rch.support { color: var(--support); } .rch.contra { color: var(--contra); }
.adate { margin-left: auto; color: var(--muted); font-size: 12px; white-space: nowrap; }
.acard .d { margin-top: 2px; }
details.qd summary { cursor: pointer; font-style: italic; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 3px; }
details.qd[open] summary { white-space: normal; overflow: visible; }
.src { color: var(--muted); font-size: 11px; margin-top: 2px; }
.cname { font-size: 13px; }
.conn { margin: 0 0 0 20px; padding: 2px 0 4px 10px; } .pill { padding: 3px 10px; } .pcols { gap: 14px; }
.mleg { display: flex; flex-wrap: wrap; gap: 4px 18px; align-items: center; color: var(--muted); font-size: 12px; }
.midk { background: var(--chip); border: 1px solid var(--line); }
table.matrix { table-layout: auto; max-width: 1200px; } .matrix th.corner { width: 220px; } .matrix th.rowh { max-width: 240px; }
td.mc { min-width: 56px; height: 64px; }
td.mc .gm { position: static; display: inline-block; max-width: 100%; font-size: 11px; line-height: 14px; font-weight: 700; padding: 2px 4px;
  background: var(--panel); color: var(--ink); border: 1px solid var(--ink); border-radius: 4px; white-space: normal; }
td.mc.gap { padding-top: 0; }

/* ---- third pass ---- */
.bar.closed { fill: url(#hatch); color: var(--muted); stroke: var(--muted); stroke-opacity: 1; stroke-width: 1.5; stroke-dasharray: 4 3; pointer-events: all; }
.bar.closed:hover, .bar.closed:focus { stroke: var(--ink); }
.vcap { stroke: var(--muted); } .vbt { fill: var(--muted); } .vbt.on { fill: var(--bg); }
.lg.dashed { border-color: var(--muted); background: repeating-linear-gradient(45deg, transparent 0 3px, var(--muted) 3px 4px); }
.vbrks { fill: var(--muted); font-size: 10px; }
.tbars { max-width: 760px; } .trow { display: grid; grid-template-columns: minmax(220px, 1.2fr) 1.5fr 40px; gap: 12px; align-items: center; padding: 3px 0; }
.tbar { height: 14px; background: var(--chip); border-radius: 3px; } .tb { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.axl { font-size: 12px; font-weight: 600; color: var(--ink); }
.half { align-items: center; gap: 6px; } .half.l { justify-content: flex-end; } .half.r { justify-content: flex-start; }
.bi { padding: 0; min-width: 4px; } .bn { font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; } .bn.against { color: var(--contra); } .bn.for { color: var(--support); }
.mwrap .mleg { margin: 10px 0 0; justify-content: flex-start; }
td.mc .gm { border: 1px solid var(--ink); }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1 id="title"></h1>
    <span class="counts" id="counts"></span>
    <div id="tabs" role="tablist" aria-label="Views">
      <button type="button" role="tab" id="tab-map" data-view="map" aria-selected="true" aria-controls="vpanel">Map</button>
      <button type="button" role="tab" id="tab-timeline" data-view="timeline" aria-selected="false" tabindex="-1" aria-controls="vpanel">Timeline</button>
      <button type="button" role="tab" id="tab-argument" data-view="argument" aria-selected="false" tabindex="-1" aria-controls="vpanel">Argument</button>
      <button type="button" role="tab" id="tab-steps" data-view="steps" aria-selected="false" tabindex="-1" aria-controls="vpanel">Steps</button>
      <button type="button" role="tab" id="tab-matrix" data-view="matrix" aria-selected="false" tabindex="-1" aria-controls="vpanel">Matrix</button>
      <button type="button" role="tab" id="tab-rhythm" data-view="rhythm" aria-selected="false" tabindex="-1" aria-controls="vpanel">Rhythm</button>
    </div>
    <span class="spacer"></span>
    <input type="search" id="search" placeholder="Find a concept" aria-label="Find a concept">
    <button id="fit" title="Show the whole graph">Fit</button>
    <button id="labels" aria-pressed="false" title="Show every label">All labels</button>
    <button id="keysBtn" title="Keyboard shortcuts">? Keys</button>
  </header>
  <aside id="left">
    <h2>Topics</h2>
    <div id="topics"></div>
    <h2>Gaps between topics</h2>
    <div id="gaps"></div>
    <h2>Show</h2>
    <label class="check"><input type="checkbox" id="showProx" checked> Shared-passage links</label>
    <label class="check"><input type="checkbox" id="showClosed"> Closed relations (history)</label>
    <label class="check"><input type="checkbox" id="showIsolated" checked> Unlinked concepts</label>
    <h2>Relations</h2>
    <div id="relations"></div>
    <h2>Shape</h2>
    <div id="diversity" class="num"></div>
  </aside>
  <main>
    <div id="why" role="status" aria-live="polite"></div>
    <div id="stage">
    <canvas id="c" aria-label="Knowledge graph"></canvas>
    <div id="ticker"></div>
    <div id="hint">Click a concept · drag to move · scroll to zoom</div>
    <div id="keys">/ find · F fit · L labels · Esc clear<br>← → step through time · H history</div>
    <div id="time">
      <button id="play" title="Replay the graph through time">Play</button>
      <span>As of</span>
      <input type="range" id="slider" min="0" max="0" value="0" aria-label="As of">
      <span class="when" id="when">now</span>
    </div>
    <div id="vpanel" role="tabpanel" aria-labelledby="tab-map" tabindex="-1" hidden></div>
    </div>
  </main>
  <aside id="right"><div id="detail" class="detail"><p class="empty">Click a concept to see its relations, where it comes from, and its history.</p></div></aside>
</div>
<script type="application/json" id="data">__DATA__</script>
<script>
"use strict";
const LIVE = __LIVE__;
let D = JSON.parse(document.getElementById("data").textContent);
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const SUPPORT = new Set(["supports","confirms","evidence_for","supported_by","demonstrates","shows","validates"]);
const CONTRA = new Set(["contradicts","refutes","disputes","conflicts_with","undermines","challenges","evidence_against","contradicted_by"]);
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

const state = { selected: null, hover: null, search: "", hiddenTopics: new Set(), hiddenRel: new Set(),
  allLabels: false, asOf: null, gap: null, flashes: new Map(), path: null, pathEdges: null };
let nodes = [], byId = new Map(), links = [], prox = [];
const cam = { x: 0, y: 0, k: 1 };
const canvas = $("c"), ctx = canvas.getContext("2d");
let W = 0, H = 0, alpha = 1;
let curView = "map", vsub = null, vtouched = false, vlastSubject = null, stepsEnds = null, lastStepsPair = null, openInfo = null, viewReady = false, renderQueued = false;

function build(keepPositions) {
  const old = byId;
  byId = new Map();
  nodes = D.nodes.map((n) => {
    const prev = old.get(n.id);
    const o = Object.assign({}, n, { r: 4 + 16 * Math.sqrt(n.degree_norm || 0) });
    if (keepPositions && prev) { o.x = prev.x; o.y = prev.y; o.vx = prev.vx; o.vy = prev.vy; o.fixed = prev.fixed; }
    byId.set(n.id, o);
    return o;
  });
  const topics = D.topics.map((t) => t.id);
  const centers = new Map();
  topics.forEach((t, i) => { const a = 2 * Math.PI * i / Math.max(1, topics.length); const R = 120 + 40 * Math.sqrt(nodes.length);
    centers.set(t, [Math.cos(a) * R, Math.sin(a) * R]); });
  for (const n of nodes) {

  for (const s of seq) { if (s.c !== undefined) { xOf.set(s.c, x); x += cw; } else { brk.push([x, s]); for (let c = s.c0; c < s.c0 + s.skip; c++) xOf.set(c, x); x += BR; } }
  const every = Math.max(1, Math.ceil(84 / cw)), ao = asOfStr(), at = ao ? Date.parse(ao) : NaN;
  let s = "", y = top0, ri = 0;
  for (const q of seq) { if (q.c === undefined) continue; if (ri++ % every) continue; const lb = B.label(q.c), lx = xOf.get(q.c);
    if (lx + textW(lb) > LM + used + 4) continue; s += '<text class="vtick" x="' + (lx + 1).toFixed(1) + '" y="24">' + esc(lb) + "</text>"; }
  s += '<text class="vtick" x="' + totX + '" y="24">total</text>';
  const rowsTop = y, rowsInfo = [];
  top.forEach((t, r) => {
    const lines = wrapLabel(t.label, LM - 16, 4), rh = Math.max(30, lines.length * 15 + 10), tot = grid[r].reduce((a, v) => a + v, 0), mid = y + rh / 2; rowsInfo.push(rh);
    s += '<text class="vlab c" x="4" y="' + (mid - (lines.length - 1) * 7.5).toFixed(1) + '"><title>' + esc(t.label) + "</title>" + svgLines(lines, 4) + "</text>";
    for (const q of seq) { if (q.c === undefined) continue; const c = q.c, v = grid[r][c], cx = xOf.get(c), w = Math.max(1, cw - 2);
      if (!v) { s += '<rect class="re" x="' + cx.toFixed(1) + '" y="' + (y + 2) + '" width="' + w.toFixed(1) + '" height="' + (rh - 4) + '"/>'; continue; }
      const op = MO + (1 - MO) * Math.sqrt(v / mx);
      s += '<rect class="rc" x="' + cx.toFixed(1) + '" y="' + (y + 2) + '" width="' + w.toFixed(1) + '" height="' + (rh - 4) + '" style="fill-opacity:' + op.toFixed(2) + '" data-rc="' + t.id + "|" + c + '"><title>' + esc(t.label + ", " + B.label(c) + ": " + v + " relation" + (v === 1 ? "" : "s")) + "</title></rect>";
      if (cw >= 24) s += '<text class="rcn' + (op > .62 ? " hi" : "") + '" x="' + (cx + w / 2).toFixed(1) + '" y="' + mid.toFixed(1) + '" text-anchor="middle">' + v + "</text>"; }
    s += '<text class="vtot" x="' + totX + '" y="' + mid.toFixed(1) + '">' + tot + "</text>"; y += rh; });
  for (const [bx, q] of brk) { const m = bx + BR / 2;
    s += '<line class="vbrk" x1="' + m + '" x2="' + m + '" y1="' + rowsTop + '" y2="' + y + '"/><text class="vbrkt" x="' + m + '" y="' + (rowsTop + 10) + '" text-anchor="middle"><title>' + q.skip + " empty " + esc(B.name) + (q.skip === 1 ? "" : "s") + ' skipped</title>\u22ef</text><text class="vbrks" transform="rotate(-90 ' + m + " " + ((rowsTop + y) / 2 + 8) + ')" x="' + m + '" y="' + ((rowsTop + y) / 2 + 8) + '" text-anchor="middle">skipped</text>'; }
  if (at === at && xOf.has(Math.max(0, Math.min(cols - 1, bucket(at))))) { const ax = xOf.get(Math.max(0, Math.min(cols - 1, bucket(at))));
    s += '<rect class="rasof" x="' + (ax - 1).toFixed(1) + '" y="' + (top0 - 2) + '" width="' + cw.toFixed(1) + '" height="' + (y - top0 + 4) + '"/><text class="vmark acc" x="' + ax.toFixed(1) + '" y="' + (y + 18) + '" text-anchor="' + (ax > LM + used / 2 ? "end" : "start") + '">as of ' + esc(dstr(ao)) + "</text>"; }
  const height = y + 30, steps = [1, Math.max(2, Math.round(mx / 4)), Math.max(3, Math.round(mx / 2)), mx].filter((v, i, a) => a.indexOf(v) === i);
  const legend = '<p class="vsum legend">Relations that began: ' + steps.map((v) => '<span class="sw" style="opacity:' + (MO + (1 - MO) * Math.sqrt(v / mx)).toFixed(2) + '"></span> ' + v).join(" ") + ' <span class="sw empty"></span> none</p>';
  p.innerHTML = vhead("rhythm", '<p class="vsum">Relations by topic, one column per ' + esc(B.name) + (nBrk ? "; empty periods collapsed (\u22ef)" : "") + ". Click a cell to list them.</p>" + legend) +
    '<svg class="vsvg" width="' + W2 + '" height="' + height + '" viewBox="0 0 ' + W2 + " " + height + '" role="group" aria-label="Relations per topic over time">' + s + "</svg>";
  p._rhythm = { name: B.name, cols, bucket };
}
function rhythmDetail(tid, c) {
  const t = D.topics.find((x) => x.id === tid), r = $("vpanel")._rhythm; if (!t || !r) return;
  const es = D.edges.filter((e) => { const tt = tms(e.valid_from, NaN); return tt === tt && Math.max(0, Math.min(r.cols - 1, r.bucket(tt))) === c && (commOf(e.source) === tid || commOf(e.target) === tid); }).sort(byFrom);
  $("detail").innerHTML = "<h3>" + esc(t.label) + "</h3>" + '<div class="meta">' + es.length + " relation" + (es.length === 1 ? "" : "s") + " began in this period</div>" +
    es.slice(0, 12).map((e) => edgeLine(e, false)).join("") + (es.length > 12 ? '<p class="num">' + (es.length - 12) + " more not listed.</p>" : "");
}

// ---- switching, tabs, wiring ----
function renderView() {
  if (curView === "map") return;
  const p = $("vpanel"), t0 = performance.now();
  try { ({ timeline: viewTimeline, argument: viewArgument, steps: viewSteps, matrix: viewMatrix, rhythm: viewRhythm })[curView](p); }
  catch (err) { console.error(err); p.innerHTML = '<p class="empty">This view could not be drawn. Try the map instead.</p>'; }
  vlastSubject = subject();
  window.knowledgeView.lastRenderMs = performance.now() - t0;
}
function scheduleRender() { if (renderQueued || curView === "map") return; renderQueued = true; requestAnimationFrame(() => { renderQueued = false; renderView(); }); }
function stripText() {
  const el = $("whyLine"); if (!el || !openInfo) return;
  el.innerHTML = (curView !== openInfo.view ? "Showing the " + VIEW_NAMES[curView].toLowerCase() + " view. " : "") + "Opened as " + openInfo.phrase +
    (openInfo.q ? " because you asked: \u201c" + esc(openInfo.q) + "\u201d" : ".");
}
function setView(name, opts) {
  if (VIEWS.indexOf(name) < 0) name = "map";
  opts = opts || {}; curView = name;
  document.querySelectorAll("#tabs [role=tab]").forEach((b) => { const on = b.dataset.view === name; b.setAttribute("aria-selected", on ? "true" : "false"); b.tabIndex = on ? 0 : -1; });
  const map = name === "map";
  canvas.style.display = map ? "" : "none"; $("vpanel").hidden = map; document.querySelector("main").classList.toggle("vmode", !map);
  $("vpanel").setAttribute("aria-labelledby", "tab-" + name);
  ["fit", "labels"].forEach((id) => { $(id).style.display = map ? "" : "none"; });
  if (!opts.noHash) { const c = state.selected && byId.has(state.selected) ? "&concept=" + encodeURIComponent(state.selected) : "";
    try { history.replaceState(null, "", "#view=" + name + c); } catch (e) { location.hash = "view=" + name + c; } }
  stripText();
  if (!map) renderView();
}
function showInMap() {
  const pair = curView === "steps" ? (stepsPair() || lastStepsPair) : null, s = subject() || state.selected;
  setView("map");
  if (pair) { select(pair[0], true); showPath(pair[0], pair[1]); } else if (s && byId.has(s)) select(s, true);
}
const baseSelect = select;
select = function (id, center) {
  baseSelect(id, center);
  if (curView === "map" || !byId.has(id)) return;
  const sub = curView === "timeline" || curView === "argument";
  $("detail").insertAdjacentHTML("beforeend", "<h2>In this view</h2><p>" + (sub && subject() !== id ? '<button type="button" data-act="subject" data-id="' + esc(id) + '">Use as the subject</button> ' : "") +
    '<button type="button" data-act="map" data-id="' + esc(id) + '">Show in map</button></p>');
  if (sub && vlastSubject !== subject()) renderView();
};
$("tabs").addEventListener("click", (ev) => { const b = ev.target.closest("[role=tab]"); if (b) setView(b.dataset.view); });
$("tabs").addEventListener("keydown", (ev) => {
  const keys = { ArrowRight: 1, ArrowLeft: -1, Home: "h", End: "e" }; if (!(ev.key in keys)) return;
  ev.preventDefault(); ev.stopPropagation();
  let i = VIEWS.indexOf(curView); const k = keys[ev.key]; i = k === "h" ? 0 : k === "e" ? VIEWS.length - 1 : (i + k + VIEWS.length) % VIEWS.length;
  setView(VIEWS[i]); $("tab-" + VIEWS[i]).focus(); });
$("right").addEventListener("click", (ev) => { if (curView !== "timeline" && curView !== "argument") return; const s = subject(); if (s && ev.target.closest("[data-node]")) vsub = s; }, true);
$("right").addEventListener("click", (ev) => { const b = ev.target.closest("[data-act]"); if (!b) return;
  if (b.dataset.act === "map") { if (b.dataset.id && byId.has(b.dataset.id)) state.selected = b.dataset.id; showInMap(); }
  else if (b.dataset.act === "subject") { vsub = b.dataset.id; renderView(); }
  else if (b.dataset.act === "mapgap") { const i = +b.dataset.i, j = +b.dataset.j; state.path = null; state.pathEdges = null; state.selected = null;
    state.gap = new Set(nodes.filter((n) => n.community === i || n.community === j).map((n) => n.id)); setView("map"); } });
$("vpanel").addEventListener("click", (ev) => {
  const t = ev.target; let el;
  if ((el = t.closest("[data-edge]"))) return edgeDetail(edgeMap().get(el.dataset.edge));
  if ((el = t.closest("[data-claim]"))) { vsub = el.dataset.claim; select(vsub); if (vlastSubject !== subject()) renderView(); return; }
  if ((el = t.closest("[data-node]"))) { if (curView === "argument" || (curView === "timeline" && subject() && el.tagName !== "text")) vsub = subject(); return select(el.dataset.node); }
  if ((el = t.closest("[data-cell]"))) { const [i, j] = el.dataset.cell.split("|").map(Number); return matrixDetail(i, j); }
  if ((el = t.closest("[data-rc]"))) { const [i, c] = el.dataset.rc.split("|").map(Number); return rhythmDetail(i, c); }
  if (t.closest(".vmap")) showInMap(); });
$("vpanel").addEventListener("submit", (ev) => { ev.preventDefault(); traceFromInputs(); });
$("vpanel").addEventListener("keydown", (ev) => { if ((ev.key === "Enter" || ev.key === " ") && ev.target.matches("[data-edge],[data-claim],[data-cell],[data-node]")) {
  ev.preventDefault(); ev.target.dispatchEvent(new MouseEvent("click", { bubbles: true })); } });
$("slider").addEventListener("input", () => { vtouched = true; scheduleRender(); });
$("showClosed").addEventListener("change", scheduleRender);
$("showProx").addEventListener("change", scheduleRender);
window.addEventListener("resize", scheduleRender);
new ResizeObserver(() => { resize(); scheduleRender(); }).observe($("stage"));

// ---- the view chosen for a question (visualize --for / --lens) ----
function applyOpen(o) {
  if (!o) return;
  const alts = (o.alternatives || []).map((a) => "<li>" + esc(a.label) + "<br><code>" + esc(a.command) + "</code></li>").join("");
  const vname = VIEW_NAMES[o.view] ? o.view : "map";
  const phrase = ({ map: "the map", timeline: "a timeline", argument: "an argument", steps: "a step-by-step chain", matrix: "a matrix", rhythm: "a rhythm chart" })[vname];
  openInfo = { view: vname, phrase, q: o.question || "" };
  $("why").innerHTML = '<span class="wl" id="whyLine"></span>' +
    '<button id="whyMore" type="button" aria-expanded="false" aria-controls="whyBody">Why / other views</button>' +
    '<button id="whyClose" type="button" aria-label="Hide this note">\u00d7</button>' +
    '<div id="whyBody" hidden>' + (o.question ? '<div class="q">\u201c' + esc(o.question) + "\u201d</div>" : "") + "<b>" + esc(o.why) + "</b>" +
    (alts ? '<div class="alt">Not what you meant? Another view:<ul>' + alts + "</ul></div>" : "") + "</div>";
  $("why").style.display = "flex";
  $("whyMore").onclick = () => { const b = $("whyBody"); b.hidden = !b.hidden; $("whyMore").setAttribute("aria-expanded", String(!b.hidden)); };
  $("whyClose").onclick = () => { $("why").style.display = "none"; };
  if (o.closed) $("showClosed").checked = true;
  if (o.as_of) { const marks = (D.time && D.time.marks) || []; let i = 0;
    for (let k = 0; k < marks.length; k++) if (marks[k] <= o.as_of) i = k;
    if (marks.length) { $("slider").value = i; $("slider").dispatchEvent(new Event("input")); }
    state.asOf = o.as_of;  // the date asked about, not the nearest earlier mark: the same relations hold, the label is right
    $("when").textContent = o.as_of.replace("T", " ").replace("Z", " UTC"); }
  const has = (id) => id && byId.has(id);
  if ((o.lens === "path" || o.lens === "gaps") && has(o.concept) && has(o.to)) { select(o.concept, true); showPath(o.concept, o.to); }
  else if (o.lens === "gaps") { const el = document.querySelector('[data-gap="0"]'); if (el) el.click(); }
  else if (has(o.concept)) select(o.concept, true);
  alpha = Math.max(alpha, .2);
  if (vname === "timeline" || vname === "argument") vsub = has(o.concept) ? o.concept : null;
  if (vname === "steps" && has(o.concept) && has(o.to)) stepsEnds = [o.concept, o.to];
  vtouched = false;
  setView(vname, { noHash: true });
}
applyOpen(D.open);
viewReady = true;
{ const hv = new URLSearchParams(location.hash.slice(1)).get("view");
  if (VIEWS.indexOf(hv) >= 0) setView(hv, { noHash: true });  // a link that names a view is an explicit choice
  const hc = new URLSearchParams(location.hash.slice(1)).get("concept");
  if (hv && hc && byId.has(hc)) select(hc, true); }
if (location.hash.startsWith("#concept=")) { const id = decodeURIComponent(location.hash.slice(9)); if (byId.has(id)) select(id, true); }
